connections {

    ipsec-test {

        version = 2

        local_addrs = 10.10.10.1
        remote_addrs = 10.10.10.2

        proposals = aes256-sha256-ecp256

        local {
            id = vm1
            auth = psk
        }

        remote {
            id = vm2
            auth = psk
        }

        children {

            net {

                mode = tunnel

                local_ts = 10.20.1.1/32
                remote_ts = 10.20.2.1/32

                esp_proposals = aes128-sha256-ecp256

                start_action = none
                dpd_action = restart
            }
        }
    }
}


secrets {

    ike-psk {

        id-1 = vm1
        id-2 = vm2

        secret = "IPsecLab-Shared-Key"
    }
}